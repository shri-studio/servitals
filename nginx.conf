server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # never serve dotfiles (e.g. the .refresh trigger the agent watches)
    location ~ /\. { return 404; }

    location / {
        add_header Cache-Control "no-cache" always;   # a browser asks for a newer page after an upgrade
        try_files $uri $uri/ =404;
    }
}
